[project]
name = "my-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-restful>=0.3.10",
    "requests>=2.34.2",
]

[project.scripts]
my-api = "my_api:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = [
    "azure-web-app",
    "azure-web-app/azure-web-app",
]
